name: Deploy to GitHub Pages

# The site is main at the root plus a preview of every open pull request from a
# branch in this repository at pr/<number>/. Pages replaces the whole site on
# each deploy, so every run builds all of them. pull_request_target runs in
# main's context, which the github-pages environment accepts.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Forks start with Pages switched off. Skip the deploy with a note rather than
  # failing on every merge until someone turns it on.
  check:
    # Only pull requests into main: the deploy runs in the base branch's context.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=GitHub Pages is off::Nothing was deployed. To play your carnival online, go to Settings > Pages, set Source to GitHub Actions, then re-run this workflow. See 'Set up your fork' in the README."
              ;;
            *)
              echo "::error title=Couldn't check GitHub Pages::The Pages API answered HTTP $status, so it's unclear whether Pages is on. Re-run this workflow."
              exit 1
              ;;
          esac

  # Builds pull request code, so it gets a read-only token and nothing else.
  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      previews: ${{ steps.site.outputs.previews }}
    steps:
      # The default branch, never the pull request's merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Open pull requests whose branch is in this repository. A pull request
      # from another fork is never built.
      - name: List pull requests to preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefOid)"' \
            > "$RUNNER_TEMP/previews.txt"
          cat "$RUNNER_TEMP/previews.txt"
      - id: site
        run: |
          scripts/build-pages-site.sh "$RUNNER_TEMP/previews.txt" "$RUNNER_TEMP/site" "$RUNNER_TEMP/built.txt"
          echo "previews=$(jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0) | tonumber)' "$RUNNER_TEMP/built.txt")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  # One comment per previewed pull request, posted the first time and edited
  # in place after that.
  comment:
    needs: [build, deploy]
    if: needs.build.outputs.previews != '[]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          PREVIEWS: ${{ needs.build.outputs.previews }}
        run: |
          marker='<!-- carnival-preview -->'
          for number in $(jq -r '.[]' <<< "$PREVIEWS"); do
            body=$(printf '%s\nPlay this pull request at %spr/%s/\n\nIt redeploys on every push, and goes away when the pull request closes.' \
              "$marker" "${PAGE_URL%/}/" "$number")
            existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
            if [ -z "$existing" ]; then
              gh api --silent "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$body"
            else
              gh api --silent --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body"
            fi
          done
